backend:
  name: git-gateway
  branch: main

locale: 'ko'

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "gallery"
    label: "일러스트 관리"
    folder: "content/gallery"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }
      - { label: "작업물 이미지", name: "image", widget: "image" }
      - label: "일러스트 방향"
        name: "orientation"
        widget: "select"
        options:
          - { label: "세로형 일러스트", value: "vertical" }
          - { label: "가로형 일러스트", value: "horizontal" }
        default: "vertical"

  - name: "videos"
    label: "영상 관리"
    folder: "content/videos"
    create: true
    extension: "json"
    format: "json"
    fields:
      - { label: "영상 제목", name: "title", widget: "string" }
      - { label: "유튜브 링크", name: "url", widget: "string" }
