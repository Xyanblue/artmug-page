local_backend: true

backend:
  name: git-gateway
  branch: main

locale: 'ko'

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "gallery_vertical"
    label: "세로형 일러스트 관리"
    files:
      - name: "vertical"
        label: "세로형 작품 편집 및 순서"
        file: "content/gallery-vertical.json"
        fields:
          - name: "items"
            label: "작품 목록"
            widget: "list"
            gallery_sortable: true
            required: false
            default: []
            summary: "{{fields.title}}"
            collapsed: true
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "작업물 이미지", name: "image", widget: "image" }
              - { name: "orientation", widget: "hidden", default: "vertical" }
              - { name: "updated_at", widget: "hidden", required: false }

  - name: "gallery_horizontal"
    label: "가로형 일러스트 관리"
    files:
      - name: "horizontal"
        label: "가로형 작품 편집 및 순서"
        file: "content/gallery-horizontal.json"
        fields:
          - name: "items"
            label: "작품 목록"
            widget: "list"
            gallery_sortable: true
            required: false
            default: []
            summary: "{{fields.title}}"
            collapsed: true
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "작업물 이미지", name: "image", widget: "image" }
              - { name: "orientation", widget: "hidden", default: "horizontal" }
              - { name: "updated_at", widget: "hidden", required: false }

  - name: "gallery_settings"
    label: "일러스트 표시 설정"
    files:
      - name: "gallery_display"
        label: "일러스트 표시 방식"
        file: "content/gallery-settings.json"
        fields:
          - label: "세로형 일러스트 표시 방식"
            name: "vertical_display"
            widget: "select"
            options:
              - { label: "슬라이드", value: "slider" }
              - { label: "기본 나열", value: "grid" }
            default: "slider"
          - label: "세로형 슬라이드 노출 개수"
            name: "vertical_slides_per_view"
            widget: "number"
            value_type: "int"
            min: 1
            max: 3
            default: 2
            hint: "세로형 표시 방식이 '슬라이드'일 때만 적용됩니다."
          - label: "가로형 일러스트 표시 방식"
            name: "horizontal_display"
            widget: "select"
            options:
              - { label: "슬라이드", value: "slider" }
              - { label: "기본 나열", value: "grid" }
            default: "slider"
          - label: "가로형 슬라이드 노출 개수"
            name: "horizontal_slides_per_view"
            widget: "number"
            value_type: "int"
            min: 1
            max: 3
            default: 1
            hint: "가로형 표시 방식이 '슬라이드'일 때만 적용됩니다."
  - name: "videos"
    label: "영상 관리"
    folder: "content/videos"
    create: true
    extension: "json"
    format: "json"
    fields:
      - { label: "영상 제목", name: "title", widget: "string" }
      - { label: "유튜브 링크", name: "url", widget: "string" }
